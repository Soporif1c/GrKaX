			shellPath = /bin/sh;
			shellScript = "# Everything the core needs at runtime goes into Resources, never into\n# Contents/MacOS: codesign treats every file there as a code object and\n# refuses to seal a bundle holding an unsignable .dat. The core is pointed\n# at this directory by the re-exec in main.swift.\n#\n# grkax-tun.sh is copied from the Compose project rather than duplicated:\n# it and TunMode.swift have to agree on the argument order, and two copies\n# would drift.\nset -e\nvendor=\"$SRCROOT/vendor\"\n[ -f \"$vendor/geodata/geoip.dat\" ] || \"$SRCROOT/scripts/fetch-geodata.sh\"\n[ -x \"$vendor/tun2socks\" ] || \"$SRCROOT/scripts/fetch-tun2socks.sh\"\n\ndest=\"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nmkdir -p \"$dest\"\ncp -f \"$vendor/geodata/geoip.dat\" \"$vendor/geodata/geosite.dat\" \"$dest/\"\ncp -f \"$vendor/tun2socks\" \"$dest/\"\ncp -f \"$SRCROOT/../desktop/resources/common/grkax-tun.sh\" \"$dest/\"\nchmod +x \"$dest/tun2socks\" \"$dest/grkax-tun.sh\"\n";
