<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="SF Pro Text, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#0E1426"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="900" height="580" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="900" height="580" fill="url(#bg)"/>

    <!-- sidebar -->
    <rect x="0" y="0" width="210" height="580" fill="#131A31"/>
    <g>
      <circle cx="24" cy="24" r="6" fill="#FF5F57"/>
      <circle cx="44" cy="24" r="6" fill="#FEBC2E"/>
      <circle cx="64" cy="24" r="6" fill="#28C840"/>
    </g>
    <text x="24" y="80" fill="#E7EAF6" font-size="19" font-weight="700">GrKa X</text>
    <text x="24" y="100" fill="#A6ADCE" font-size="12">Отключено</text>

    <text x="28" y="154" fill="#A6ADCE" font-size="13">◉</text>
    <text x="50" y="154" fill="#A6ADCE" font-size="13">Главная</text>

    <text x="28" y="200" fill="#A6ADCE" font-size="13">☰</text>
    <text x="50" y="200" fill="#A6ADCE" font-size="13">Серверы</text>

    <rect x="12" y="222" width="186" height="38" rx="10" fill="#2C2A5E"/>
    <text x="28" y="246" fill="#DCD6FF" font-size="13">⚙</text>
    <text x="50" y="246" fill="#DCD6FF" font-size="13" font-weight="600">Настройки</text>

    <text x="28" y="292" fill="#A6ADCE" font-size="13">▤</text>
    <text x="50" y="292" fill="#A6ADCE" font-size="13">Логи</text>

    <text x="24" y="556" fill="#5A617A" font-size="10">версия 0.1.0</text>

    <!-- header -->
    <text x="246" y="56" fill="#E7EAF6" font-size="20" font-weight="700">Настройки</text>

    <!-- card: network mode -->
    <rect x="246" y="78" width="618" height="132" rx="16" fill="#131A31" stroke="#22284a" stroke-width="1"/>
    <text x="266" y="104" fill="#A6ADCE" font-size="12" font-weight="600">Как трафик попадает в приложение</text>
    <rect x="266" y="118" width="330" height="40" rx="12" fill="#1C2444"/>
    <rect x="272" y="124" width="159" height="28" rx="9" fill="#8B7CFF"/>
    <text x="351" y="143" fill="#0B1020" font-size="12" font-weight="700" text-anchor="middle">Системный прокси</text>
    <text x="511" y="143" fill="#A6ADCE" font-size="12" text-anchor="middle">TUN</text>
    <text x="266" y="180" fill="#5A617A" font-size="11">Прописывается в активную сеть (Wi-Fi / Ethernet). Прав не требует, но трафик увидят</text>
    <text x="266" y="196" fill="#5A617A" font-size="11">только приложения, уважающие настройки прокси.</text>

    <!-- card: routing -->
    <rect x="246" y="222" width="618" height="196" rx="16" fill="#131A31" stroke="#22284a" stroke-width="1"/>
    <text x="266" y="248" fill="#A6ADCE" font-size="12" font-weight="600">Маршрутизация</text>

    <text x="266" y="278" fill="#E7EAF6" font-size="13">Правила из подписки</text>
    <text x="266" y="295" fill="#A6ADCE" font-size="11">Использовать routing/dns, которые прислала панель</text>
    <rect x="800" y="272" width="44" height="24" rx="12" fill="#8B7CFF"/>
    <circle cx="832" cy="284" r="9" fill="#0B1020"/>

    <text x="266" y="330" fill="#E7EAF6" font-size="13">Встроенный набор правил</text>
    <rect x="266" y="340" width="330" height="40" rx="12" fill="#1C2444"/>
    <rect x="272" y="346" width="159" height="28" rx="9" fill="#8B7CFF"/>
    <text x="351" y="365" fill="#0B1020" font-size="11" font-weight="700" text-anchor="middle">Обход локальной сети</text>
    <text x="511" y="365" fill="#A6ADCE" font-size="11" text-anchor="middle">Обход RU</text>
    <text x="266" y="400" fill="#5A617A" font-size="11">Применяется, только когда подписка и шаблон не принесли своих правил.</text>

    <!-- card: template -->
    <rect x="246" y="430" width="618" height="130" rx="16" fill="#131A31" stroke="#22284a" stroke-width="1"/>
    <text x="266" y="456" fill="#A6ADCE" font-size="12" font-weight="600">Шаблон конфига (JSON)</text>
    <rect x="266" y="468" width="578" height="58" rx="10" fill="#0E1426" stroke="#39406B" stroke-width="1"/>
    <text x="280" y="490" fill="#22D3EE" font-size="11" font-family="SF Mono, Consolas, monospace">{ "routing": { "rules": [ … ] },</text>
    <text x="280" y="508" fill="#22D3EE" font-size="11" font-family="SF Mono, Consolas, monospace">  "dns": { "servers": [ "1.1.1.1" ] } }</text>
    <rect x="266" y="534" width="92" height="16" rx="8" fill="#8B7CFF"/>
    <text x="312" y="546" fill="#0B1020" font-size="10" font-weight="700" text-anchor="middle">Сохранить</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="none" stroke="#2A3352" stroke-width="1"/>
</svg>
