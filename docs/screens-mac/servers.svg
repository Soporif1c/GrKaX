    <text x="288" y="387" fill="#A6ADCE" font-size="11">VLESS · WS · TLS · fi-01.example.net:443</text>
    <text x="800" y="377" fill="#22D3EE" font-size="12" font-weight="600" text-anchor="end">61 мс</text>
    <text x="845" y="377" fill="#A6ADCE" font-size="12" text-anchor="end">✕</text>

    <rect x="246" y="408" width="618" height="56" rx="14" fill="#131A31"/>
    <circle cx="270" cy="436" r="4" fill="#39406B"/>
    <text x="288" y="432" fill="#E7EAF6" font-size="13">Sweden · Stockholm</text>
    <text x="288" y="451" fill="#A6ADCE" font-size="11">TROJAN · GRPC · TLS · se-01.example.net:443</text>
    <text x="800" y="441" fill="#A6ADCE" font-size="12" font-weight="600" text-anchor="end">318 мс</text>
    <text x="845" y="441" fill="#A6ADCE" font-size="12" text-anchor="end">✕</text>

    <rect x="246" y="472" width="618" height="56" rx="14" fill="#131A31"/>
